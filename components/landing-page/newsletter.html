<!-- ============================================
     NEWSLETTER / CTA SECTION
     ============================================ -->
<section class="lp-newsletter" id="newsletter">
  <div class="lp-container">
    <div class="lp-newsletter-card">
      <div class="lp-newsletter-content">
        <h2 class="lp-newsletter-title">Get the good stuff&nbsp;<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="32" height="32" style="display: inline-block; vertical-align: middle;"><circle cx="12" cy="12" r="10"/><path d="M8 12l2 2 4-4"/></svg></h2>
        <p class="lp-newsletter-desc">
          Tips on selling smarter, buying cheaper, and making your items last longer. Enter your email for occasional updates.
        </p>
        <form class="lp-newsletter-form" id="newsletter-form" aria-label="Newsletter signup">
          <input
            type="email"
            name="email"
            placeholder="Your email"
            required
            class="lp-newsletter-input"
          />
          <button type="submit" class="lp-btn lp-btn--primary">Sign up</button>
        </form>
        <p class="lp-newsletter-disclaimer">No spam, unsubscribe at any time.</p>
      </div>
      <div class="lp-newsletter-image">
        <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=400&h=500&fit=crop" alt="Students collaborating on campus" loading="lazy" />
      </div>
    </div>
  </div>
</section>
