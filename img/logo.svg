<!-- Uni-Hub SVG Logo -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50" class="unihub-logo-svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0046be;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003399;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Graduation Cap Icon -->
  <g transform="translate(2, 5)">
    <rect x="0" y="8" width="36" height="28" rx="6" fill="url(#logoGrad)"/>
    <path d="M18 12 L4 20 L18 28 L32 20 Z" fill="#ffce00"/>
    <circle cx="18" cy="12" r="3" fill="#ffce00"/>
    <line x1="32" y1="20" x2="32" y2="30" stroke="#ffce00" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="31" r="1.5" fill="#ffce00"/>
  </g>
  <!-- Text: UNI-HUB -->
  <text x="46" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="currentColor" letter-spacing="-0.5">UNI<tspan fill="#0046be">-</tspan>HUB</text>
</svg>
