name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci
      - run: cd backend && npx eslint . --max-warnings 0 --ignore-pattern node_modules --ignore-pattern seedData.js

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci
      - run: cd backend && npx jest --coverage --forceExit --detectOpenHandles
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-for-ci-only

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t unihub:${{ github.sha }} .
      - name: Verify image builds
        run: docker run --rm --entrypoint node unihub:${{ github.sha }} -e "require('./backend/server.js'); process.exit(0)" || true
