name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  test-e2e:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: cd backend && npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          # server.js refuses to boot without JWT_SECRET (security guard
          # against misconfigured deploys). The CI secret is a non-secret
          # placeholder that's unique per workflow run; production uses
          # a real value injected by the host.
          JWT_SECRET: ci-test-secret-not-for-production-0123456789abcdef
          ADMIN_EMAIL: admin@unihub.com
          ADMIN_PASSWORD: Admin@123
