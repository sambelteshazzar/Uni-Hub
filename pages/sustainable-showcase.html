<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sustainable Fashion Showcase - Discover ethical and sustainable clothing"
    />
    <meta name="theme-color" content="#fefaf1" />
    <title>Sustainable Showcase - Ethical Fashion</title>

    <!-- Declare CSS layers before stylesheets -->
    <style>
      @layer base, component;
    </style>

    <!-- Component Styles -->
    <link rel="stylesheet" href="../css/components/sustainable-showcase.css" />

    <!-- Minimal reset for standalone page -->
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: #fefaf1;
        min-height: 100vh;
      }

      /* FAQ Toggle Styles */
      .faq-item__answer {
        display: none;
      }

      .faq-item__answer.is-open {
        display: block;
      }

      .faq-item__trigger[aria-expanded='true'] + .faq-item__answer {
        display: block;
      }

      .faq-item__icon {
        transition: transform 0.2s ease;
      }

      .faq-item__trigger[aria-expanded='true'] .faq-item__icon {
        transform: rotate(45deg);
      }
    </style>
  </head>

  <body>
    <!-- Include Component HTML -->
    <div id="showcase-container"></div>

    <script>
      // Load the component HTML
      fetch('../components/sustainable-showcase.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('showcase-container').innerHTML = html;
          initFAQ();
        })
        .catch(error => {
          console.error('Error loading component:', error);
          document.getElementById('showcase-container').innerHTML = `
            <div style="padding: 4rem 2rem; text-align: center; font-family: 'Inter', sans-serif;">
              <h1 style="font-size: 2rem; margin-bottom: 1rem;">Error Loading Component</h1>
              <p>Could not load the sustainable showcase component.</p>
              <p style="color: #666; margin-top: 1rem;">Make sure you're running this from a local server.</p>
            </div>
          `;
        });

      // FAQ Toggle functionality
      function initFAQ() {
        const triggers = document.querySelectorAll('.faq-item__trigger');
        triggers.forEach(trigger => {
          trigger.addEventListener('click', () => {
            const isExpanded = trigger.getAttribute('aria-expanded') === 'true';
            const answer = trigger.nextElementSibling;

            // Toggle current
            trigger.setAttribute('aria-expanded', !isExpanded);
            if (answer) {
              answer.classList.toggle('is-open');
            }
          });

          // Keyboard support
          trigger.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              trigger.click();
            }
          });
        });
      }
    </script>
  </body>
</html>
