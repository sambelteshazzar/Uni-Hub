services:
  - type: web
    name: uni-hub-api
    runtime: node
    buildFilter:
      paths:
        - backend/**
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    env: node
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: uni-hub-frontend
    runtime: static
    buildFilter:
      paths:
        - index.html
        - js/**
        - css/**
        - assets/**
    staticPublishPath: ./
    routes:
      - type: rewrite
        source: /.*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
